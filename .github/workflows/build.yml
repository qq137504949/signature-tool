name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe (PyInstaller)
        shell: pwsh
        run: pyinstaller signature_tool.spec --noconfirm --clean

      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SignatureTool.exe" -ArgumentList "--selftest" -PassThru -Wait
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "exe selftest failed" }

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\SignatureTool.exe" -DestinationPath "SignatureTool-${{ github.ref_name }}-win64-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SignatureTool-windows-x64
          path: |
            SignatureTool-*-win64-portable.zip
            installer_output/*.exe
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SignatureTool-*-win64-portable.zip
            installer_output/*.exe
